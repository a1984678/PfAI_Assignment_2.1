[project]
name = "NumCompute"
version = "0.0.1"
dependencies = [
    "numpy",
    "pytest",
    "pytest-cov",
    "flake8"
]


[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["numcompute*"]