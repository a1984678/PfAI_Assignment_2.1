name: NumCompute-Stream Tests

on:
  push:
    branches: [main, "PfAI_Assignment_2.2**"]
    paths: ["NumCompute-Stream/**", ".github/workflows/stream-tests.yml"]
  pull_request:
    branches: [main]
    paths: ["NumCompute-Stream/**", ".github/workflows/stream-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: NumCompute-Stream

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: NumCompute-Stream/pyproject.toml

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: NumCompute-Stream/coverage.xml

      - name: Lint with flake8
        working-directory: .
        continue-on-error: true
        run: flake8 NumCompute-Stream
