[project]
name = "numcompute-stream"
version = "0.0.1"
dependencies = [
    "numpy",
    "matplotlib",
    "pytest",
    "pytest-cov",
    "flake8"
]

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["numcompute_stream"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["numcompute_stream*"]
